services:
  # ── PostgreSQL 16 + pgvector ──
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pei
      POSTGRES_PASSWORD: recommend
      POSTGRES_DB: recommend_agent
    ports:
      - "15433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pei", "-d", "recommend_agent"]
      interval: 5s
      retries: 5

  # ── Redis 7 ──
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--ignore-warnings", "ARM64-COW-BUG"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ── 推荐服务（后端） ──
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── 前端（nginx：仅托管静态页面，独立开放端口） ──
  front:
    build:
      context: ./front
    ports:
      - "5437:80"
    restart: unless-stopped

volumes:
  pgdata:
